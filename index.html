<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Todo List</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 500px; margin: 2rem auto; padding: 0 1rem; }
  form { display: flex; gap: .5rem; }
  input[type="text"] { flex: 1; padding: .5rem; }
  button { padding: .5rem 1rem; cursor: pointer; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; gap: .5rem; padding: .5rem; border-bottom: 1px solid #ddd; }
  li.done span { text-decoration: line-through; color: #888; }
  li span { flex: 1; }
  .del-btn { background: #ef4444; color: white; border: none; border-radius: 4px; }
</style>
</head>
<body>
<h1>Todo List</h1>
<form id="form">
  <input id="input" type="text" placeholder="Tulis todo baru..." autocomplete="off" />
  <button type="submit">Tambah</button>
</form>
<ul id="list"></ul>

<script>
  const form = document.getElementById('form');
  const input = document.getElementById('input');
  const list = document.getElementById('list');

  let todos = JSON.parse(localStorage.getItem('todos') || '[]');

  function save() {
    localStorage.setItem('todos', JSON.stringify(todos));
  }

  function render() {
    list.innerHTML = '';
    todos.forEach((todo) => {
      const li = document.createElement('li');
      if (todo.done) li.classList.add('done');
      li.dataset.id = String(todo.id);

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = todo.done;
      checkbox.addEventListener('change', () => toggleTodo(todo.id));

      const span = document.createElement('span');
      span.textContent = todo.text;

      const delBtn = document.createElement('button');
      delBtn.textContent = 'Hapus';
      delBtn.className = 'del-btn';
      delBtn.type = 'button';
      delBtn.addEventListener('click', () => deleteTodo(todo.id));

      li.append(checkbox, span, delBtn);
      list.appendChild(li);
    });
  }

  function addTodo(text) {
    todos.push({ id: Date.now(), text, done: false });
    save();
    render();
  }

  function toggleTodo(id) {
    todos = todos.map((t) => (t.id === id ? { ...t, done: !t.done } : t));
    save();
    render();
  }

  // BUG: delete tidak jalan - filter tidak di-assign ulang
  function deleteTodo(id) {
    todos.filter((t) => t.id !== id);
    save();
    render();
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    addTodo(text);
    input.value = '';
    input.focus();
  });

  // Expose untuk testing
  window.__todos = () => todos;
  window.__actions = { addTodo, deleteTodo, toggleTodo };

  render();
</script>
</body>
</html>
